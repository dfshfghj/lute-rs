[package]
name = "lute-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm binding of lute"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = [
    "emoji",
    "autolink",
    "mindmap",
    "render-json",
    "vditor-sv",
    "protyle",
    "kramdown-ial",
    "auto-space",
]

emoji = ["lute-core/emoji"]
autolink = ["lute-core/autolink"]
mindmap = ["lute-core/mindmap"]
render-json = ["lute-core/render-json"]
vditor-sv = ["lute-core/vditor-sv"]
protyle = ["lute-core/protyle"]
kramdown-ial = ["lute-core/kramdown-ial"]
auto-space = ["lute-core/auto-space"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
lute-core = { path = "../lute-core", default-features = false, features = ["javascript"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lute-core = { path = "../lute-core", default-features = false }
