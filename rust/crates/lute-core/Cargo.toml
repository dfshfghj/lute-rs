[package]
name = "lute-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rust core of lute"

[lib]
name = "lute_core"
path = "src/lib.rs"

[dependencies]
serde_json = "1"

[features]
default = [
    "emoji",
    "autolink",
    "mindmap",
    "render-json",
    "vditor-sv",
    "protyle",
    "kramdown-ial",
    "auto-space",
]
javascript = []
emoji = []
autolink = []
mindmap = []
render-json = []
vditor-sv = []
protyle = []
kramdown-ial = []
auto-space = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
