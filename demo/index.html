<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lute (Rust/WASM) × Vditor</title>
<link rel="stylesheet" href="vendor/vditor/dist/index.css">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f7f9;
    color: #1f2328;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 10px 20px;
    background: #fff;
    border-bottom: 1px solid #e3e5e8;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header h1 small { color: #6a737d; font-weight: 400; }
  .badge {
    padding: 2px 8px;
    border-radius: 999px;
    background: #eaf3ff;
    color: #1f6feb;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .badge.muted { background: #eef0f2; color: #57606a; }
  .spacer { flex: 1; }
  .hint { color: #6a737d; font-size: 12px; }
  main { padding: 16px 20px 0; }
  #vditor { background: #fff; border: 1px solid #e3e5e8; border-radius: 8px; }
  #console {
    margin: 12px 20px 20px;
    border: 1px solid #e3e5e8;
    border-radius: 8px;
    background: #fff;
    overflow: hidden;
  }
  #console summary {
    cursor: pointer;
    padding: 8px 12px;
    font-weight: 600;
    user-select: none;
  }
  #console pre {
    margin: 0;
    padding: 10px 12px;
    max-height: 260px;
    overflow: auto;
    border-top: 1px solid #eef0f2;
    background: #fbfbfc;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #console .ok { color: #1a7f37; }
  #console .bad { color: #cf222e; }
  #fatal {
    display: none;
    margin: 40px auto;
    max-width: 720px;
    padding: 16px 20px;
    border: 1px solid #f0b4b4;
    border-radius: 8px;
    background: #fff5f5;
  }
  #fatal code { background: #fff; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>Lute <small>Rust / WebAssembly</small></h1>
  <span class="badge" id="engine">加载中…</span>
  <span class="badge muted" id="version">Lute v?</span>
  <span class="spacer"></span>
  <span class="hint">模式切换用工具栏的「编辑模式 / 分屏预览」按钮</span>
</header>

<div id="fatal"></div>

<main>
  <div id="vditor"></div>
</main>

<details id="console" open>
  <summary>Lute 自检（同一实例上的往返调用）</summary>
  <pre id="selfcheck">等待 Vditor 初始化…</pre>
</details>

<script src="vendor/vditor/dist/index.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
